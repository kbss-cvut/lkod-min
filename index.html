<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lokální katalog otevřených dat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef0ea;
    --card:#faf9f4;
    --ink:#16211c;
    --ink-soft:#4a564e;
    --rule:#c9cabf;
    --stamp:#8a5a1f;
    --stamp-soft:#e7dcc7;
    --accent:#2f5a4d;
    --accent-soft:#dfe8e2;
    --danger:#7a2b22;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%),
      repeating-linear-gradient(180deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:48px 20px 96px;}

  /* header */
  header{border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:28px;}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);margin:0 0 8px;}
  h1{font-family:"IBM Plex Serif",serif;font-weight:600;font-size:32px;line-height:1.15;margin:0 0 10px;}
  .cat-desc{font-size:15px;color:var(--ink-soft);max-width:62ch;margin:0 0 14px;}
  .meta-row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-soft);}
  .meta-row a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;}
  .meta-row a:hover{border-bottom-color:var(--accent);}

  /* source config */
  .source-bar{display:flex;gap:8px;align-items:center;margin:18px 0 0;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft);}
  .source-bar input{
    flex:1;font:inherit;font-family:"IBM Plex Mono",monospace;font-size:12px;
    padding:7px 10px;border:1px solid var(--rule);border-radius:var(--radius);background:#fff;color:var(--ink);
  }
  .source-bar button{
    font:inherit;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;
    padding:7px 12px;border:1px solid var(--ink);border-radius:var(--radius);background:var(--ink);color:#fff;cursor:pointer;
  }
  .source-bar button:hover{background:var(--accent);border-color:var(--accent);}

  /* search + count */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:32px 0 18px;}
  .search{
    font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--rule);border-radius:var(--radius);
    background:var(--card);color:var(--ink);width:100%;max-width:340px;
  }
  .search:focus{outline:none;border-color:var(--accent);}
  .count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft);white-space:nowrap;}

  /* state messages */
  .state{padding:28px 0;color:var(--ink-soft);font-size:14px;}
  .state.error{color:var(--danger);}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin-right:8px;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* index cards */
  .card{
    background:var(--card);
    border:1px solid var(--rule);
    border-left:3px solid var(--stamp);
    border-radius:var(--radius);
    margin-bottom:14px;
    position:relative;
  }
  .card-head{
    display:flex;gap:16px;align-items:flex-start;justify-content:space-between;
    padding:16px 18px;cursor:pointer;
  }
  .card-num{
    font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--stamp);
    background:var(--stamp-soft);padding:2px 6px;border-radius:2px;white-space:nowrap;margin-top:3px;
  }
  .card-title-wrap{flex:1;min-width:0;}
  .card-title{font-family:"IBM Plex Serif",serif;font-weight:600;font-size:18px;margin:0 0 4px;}
  .card-desc{font-size:13.5px;color:var(--ink-soft);margin:0 0 8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.02em;
    padding:2px 7px;border-radius:10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;
  }
  .tag.fmt{background:#eee7d6;color:var(--stamp);}
  .caret{font-size:13px;color:var(--ink-soft);margin-top:5px;transition:transform .15s ease;flex-shrink:0;}
  .card.open .caret{transform:rotate(90deg);}

  .card-body{display:none;border-top:1px dashed var(--rule);padding:16px 18px 20px;}
  .card.open .card-body{display:block;}
  .full-desc{font-size:14px;line-height:1.55;color:var(--ink);white-space:pre-line;margin:0 0 16px;}

  .field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 20px;margin-bottom:18px;}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px;}
  .field div{font-size:13.5px;}

  .dist-title{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;}
  .dist{border:1px solid var(--rule);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;background:#fff;}
  .dist-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .dist-name{font-size:13.5px;font-weight:500;}
  .dist-dl{
    font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);text-decoration:none;
    border:1px solid var(--accent);padding:4px 10px;border-radius:2px;white-space:nowrap;
  }
  .dist-dl:hover{background:var(--accent);color:#fff;}
  .dist-meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);margin-top:4px;}

  .empty{padding:40px 0;text-align:center;color:var(--ink-soft);font-size:14px;}
  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font-size:11.5px;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;}
  footer a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Lokální katalog otevřených dat &middot; LKOD</p>
    <h1 id="cat-title">Načítám katalog…</h1>
    <p class="cat-desc" id="cat-desc"></p>
    <div class="meta-row" id="cat-meta"></div>
    <div class="source-bar">
      <span>zdroj:</span>
      <input id="source-input" type="text" spellcheck="false">
      <button id="source-reload">Načíst</button>
    </div>
  </header>

  <div class="toolbar">
    <input class="search" id="search" type="text" placeholder="Hledat v datových sadách…" disabled>
    <span class="count" id="count"></span>
  </div>

  <div id="state" class="state"><span class="spinner"></span>Načítám katalog.jsonld…</div>
  <div id="list"></div>

  <footer>
    Generováno staticky z <a id="footer-link" href="#" target="_blank" rel="noopener">katalog.jsonld</a> (OFN Rozhraní katalogů otevřených dat).
  </footer>
</div>

<script>
/* ---------- config ---------- */
const params = new URLSearchParams(location.search);
const DEFAULT_SOURCE = "katalog.jsonld"; // relative: place this file next to your katalog.jsonld
const initialSource = params.get("katalog") || localStorage.getItem("lkod-source") || DEFAULT_SOURCE;

/* ---------- small vocab lookups (EU Publications Office authority tables) ---------- */
const FREQ = {WEEKLY:"týdně",DAILY:"denně",MONTHLY:"měsíčně",ANNUAL:"ročně",QUARTERLY:"čtvrtletně",
  IRREG:"nepravidelně",CONT:"průběžně",NEVER:"jednorázově",BIENNIAL:"jednou za 2 roky",BIWEEKLY:"jednou za 2 týdny",
  HOURLY:"hodinově",OTHER:"jiná"};
const THEME = {GOVE:"Veřejná správa",ECON:"Ekonomika a finance",ENVI:"Životní prostředí",TRAN:"Doprava",
  HEAL:"Zdraví",EDUC:"Vzdělávání",SOCI:"Společnost",JUST:"Spravedlnost a právo",AGRI:"Zemědělství",
  TECH:"Věda a technika",ENER:"Energetika",REGI:"Regiony a města",INTR:"Mezinárodní témata"};

function lastSegment(iri){ if(!iri) return ""; const s = iri.split(/[\/#]/).filter(Boolean); return s[s.length-1]; }
function label(iri, dict){ const code = lastSegment(iri).toUpperCase(); return dict[code] || lastSegment(iri) || iri; }
function text(v, lang){
  if (v == null) return "";
  if (typeof v === "string") return v;
  return v[lang] || v.cs || v.en || Object.values(v)[0] || "";
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- fetch helpers ---------- */
async function fetchJson(url){
  const res = await fetch(url, {headers:{Accept:"application/ld+json, application/json"}});
  if (!res.ok) throw new Error(`${res.status} ${res.statusText} pro ${url}`);
  return res.json();
}

/* ---------- rendering ---------- */
let DATASETS = [];

function renderCatalogHeader(cat, sourceUrl){
  document.getElementById("cat-title").textContent = text(cat.název, "cs") || "Lokální katalog otevřených dat";
  document.getElementById("cat-desc").textContent = text(cat.popis, "cs") || "";
  const meta = [];
  if (cat.domovská_stránka) meta.push(`<a href="${escapeHtml(cat.domovská_stránka)}" target="_blank" rel="noopener">domovská stránka ↗</a>`);
  if (cat.kontaktní_bod && cat.kontaktní_bod["e-mail"])
    meta.push(`kontakt: <a href="${escapeHtml(cat.kontaktní_bod["e-mail"])}">${escapeHtml(text(cat.kontaktní_bod.jméno,"cs") || cat.kontaktní_bod["e-mail"].replace("mailto:",""))}</a>`);
  if (Array.isArray(cat.datová_sada)) meta.push(`${cat.datová_sada.length} datových sad`);
  document.getElementById("cat-meta").innerHTML = meta.join(" &middot; ");
  document.getElementById("footer-link").href = sourceUrl;
}

function distSummary(ds){
  const dists = Array.isArray(ds.distribuce) ? ds.distribuce : [];
  const formats = [...new Set(dists.map(d => label(d.formát, {})))].filter(Boolean);
  return formats;
}

function cardHtml(ds, idx){
  const title = text(ds.název, "cs") || "(bez názvu)";
  const desc = text(ds.popis, "cs") || "";
  const kw = (ds.klíčové_slovo && (ds.klíčové_slovo.cs || ds.klíčové_slovo.en)) || [];
  const themes = (ds.téma || []).map(t => label(t, THEME));
  const formats = distSummary(ds);
  const num = String(idx+1).padStart(3,"0");

  const tags = [
    ...themes.map(t => `<span class="tag">${escapeHtml(t)}</span>`),
    ...formats.map(f => `<span class="tag fmt">${escapeHtml(f)}</span>`)
  ].join("");

  return `
  <article class="card" data-idx="${idx}">
    <div class="card-head">
      <span class="card-num">č. ${num}</span>
      <div class="card-title-wrap">
        <p class="card-title">${escapeHtml(title)}</p>
        <p class="card-desc">${escapeHtml(desc)}</p>
        <div class="tags">${tags}</div>
      </div>
      <span class="caret">▸</span>
    </div>
    <div class="card-body">${cardBodyHtml(ds)}</div>
  </article>`;
}

function cardBodyHtml(ds){
  const desc = text(ds.popis, "cs") || text(ds.popis, "en") || "";
  const freq = ds.periodicita_aktualizace ? label(ds.periodicita_aktualizace, FREQ) : "—";
  const provider = ds.poskytovatel || "—";
  const contact = ds.kontaktní_bod ? (text(ds.kontaktní_bod.jméno,"cs") + (ds.kontaktní_bod["e-mail"] ? ` (${ds.kontaktní_bod["e-mail"].replace("mailto:","")})` : "")) : "—";
  const iri = ds.iri || "—";

  const fields = `
    <div class="field-grid">
      <div class="field"><label>Aktualizace</label><div>${escapeHtml(freq)}</div></div>
      <div class="field"><label>Poskytovatel</label><div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;word-break:break-all;">${escapeHtml(provider)}</div></div>
      <div class="field"><label>Kontaktní bod</label><div>${escapeHtml(contact)}</div></div>
      <div class="field"><label>Záznam (IRI)</label><div><a href="${escapeHtml(iri)}" target="_blank" rel="noopener" style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;word-break:break-all;">${escapeHtml(iri)}</a></div></div>
    </div>`;

  const dists = Array.isArray(ds.distribuce) ? ds.distribuce : [];
  const distHtml = dists.length ? `
    <p class="dist-title">Distribuce ke stažení</p>
    ${dists.map(d => {
      const dname = text(d.název,"cs") || "Soubor ke stažení";
      const url = d.soubor_ke_stažení || d.přístupové_url || "#";
      const fmt = d.formát ? label(d.formát, {}) : "";
      const media = d.typ_média ? lastSegment(d.typ_média) : "";
      return `<div class="dist">
        <div class="dist-row">
          <span class="dist-name">${escapeHtml(dname)}</span>
          <a class="dist-dl" href="${escapeHtml(url)}" target="_blank" rel="noopener">Stáhnout ↓</a>
        </div>
        <div class="dist-meta">${[fmt, media].filter(Boolean).map(escapeHtml).join(" · ")}</div>
      </div>`;
    }).join("")}
  ` : "";

  return `<p class="full-desc">${escapeHtml(desc)}</p>${fields}${distHtml}`;
}

function renderList(items){
  const list = document.getElementById("list");
  document.getElementById("count").textContent = `${items.length} / ${DATASETS.length}`;
  if (!items.length){
    list.innerHTML = `<div class="empty">Žádná datová sada neodpovídá hledání.</div>`;
    return;
  }
  list.innerHTML = items.map((ds) => cardHtml(ds, DATASETS.indexOf(ds))).join("");
  list.querySelectorAll(".card-head").forEach(h => {
    h.addEventListener("click", () => h.closest(".card").classList.toggle("open"));
  });
}

function applyFilter(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  if (!q) { renderList(DATASETS); return; }
  const filtered = DATASETS.filter(ds => {
    const hay = [
      text(ds.název,"cs"), text(ds.název,"en"), text(ds.popis,"cs"), text(ds.popis,"en"),
      ...(ds.klíčové_slovo ? [...(ds.klíčové_slovo.cs||[]), ...(ds.klíčové_slovo.en||[])] : []),
      ...(ds.téma||[])
    ].join(" ").toLowerCase();
    return hay.includes(q);
  });
  renderList(filtered);
}

/* ---------- main load ---------- */
async function loadCatalog(sourceUrl){
  const stateEl = document.getElementById("state");
  const listEl = document.getElementById("list");
  const searchEl = document.getElementById("search");
  searchEl.disabled = true;
  listEl.innerHTML = "";
  stateEl.className = "state";
  stateEl.innerHTML = `<span class="spinner"></span>Načítám katalog.jsonld…`;

  try {
    const cat = await fetchJson(sourceUrl);
    renderCatalogHeader(cat, sourceUrl);
    const dsIris = Array.isArray(cat.datová_sada) ? cat.datová_sada : [];

    stateEl.innerHTML = `<span class="spinner"></span>Načítám ${dsIris.length} datových sad…`;

    const results = await Promise.allSettled(dsIris.map(iri => fetchJson(iri)));
    DATASETS = results.filter(r => r.status === "fulfilled").map(r => r.value);
    const failed = results.filter(r => r.status === "rejected");

    stateEl.className = "state";
    stateEl.style.display = failed.length ? "block" : "none";
    if (failed.length){
      stateEl.className = "state error";
      stateEl.textContent = `${failed.length} datová sada se nepodařilo načíst (zkontrolujte CORS / IRI). Zobrazuji zbylých ${DATASETS.length}.`;
    }

    searchEl.disabled = false;
    renderList(DATASETS);
  } catch (err) {
    stateEl.className = "state error";
    stateEl.textContent = `Nepodařilo se načíst katalog z „${sourceUrl}“: ${err.message}`;
    document.getElementById("cat-title").textContent = "Katalog se nepodařilo načíst";
    document.getElementById("count").textContent = "";
  }
}

document.getElementById("source-input").value = initialSource;
document.getElementById("search").addEventListener("input", applyFilter);
document.getElementById("source-reload").addEventListener("click", () => {
  const v = document.getElementById("source-input").value.trim();
  if (!v) return;
  localStorage.setItem("lkod-source", v);
  loadCatalog(v);
});
document.getElementById("source-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("source-reload").click();
});

loadCatalog(initialSource);
</script>
</body>
</html>
